name: Ingest Infra

on:
  push:
    branches:
      - dev
    paths:
      - 'books/**/*.epub'
      - 'ingestion/**'
      - '.github/workflows/infra-ingest.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment to ingest into
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      bookGlob:
        description: EPUB path or glob
        required: true
        default: books/**/*.epub
      force:
        description: Re-import books whose checksum is already active
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: book-ingestion-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  BOOK_GLOB: ${{ github.event_name == 'workflow_dispatch' && inputs.bookGlob || 'books/**/*.epub' }}
  EMBEDDING_DEPLOYMENT: text-embedding-3-small

jobs:
  test:
    name: Test EPUB ingestion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement ingestion/requirements-dev.txt

      - name: Run ingestion tests
        working-directory: ingestion
        run: python -m pytest -q

      - name: Validate checked-in EPUBs
        run: >-
          python -m ingestion.adventra_ingest.cli
          "${{ env.BOOK_GLOB }}"
          --source-root .
          --dry-run

  ingest:
    name: Ingest EPUBs into Azure PostgreSQL
    runs-on: ubuntu-latest
    needs: test
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --requirement ingestion/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover Azure resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail

          RESOURCE_GROUP="adventra-${TARGET_ENVIRONMENT}"
          POSTGRES_SERVER=$(az postgres flexible-server list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?tags.environment=='${TARGET_ENVIRONMENT}'].name | [0]" \
            --output tsv)
          OPENAI_ACCOUNT=$(az cognitiveservices account list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?kind=='OpenAI'].name | [0]" \
            --output tsv)

          if [[ -z "$POSTGRES_SERVER" || -z "$OPENAI_ACCOUNT" ]]; then
            echo "Unable to discover PostgreSQL or Azure OpenAI in $RESOURCE_GROUP"
            exit 1
          fi

          OPENAI_ENDPOINT=$(az cognitiveservices account show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$OPENAI_ACCOUNT" \
            --query properties.endpoint \
            --output tsv)
          az cognitiveservices account deployment show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$OPENAI_ACCOUNT" \
            --deployment-name "$EMBEDDING_DEPLOYMENT" \
            --only-show-errors \
            --output none

          echo "resource_group=$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
          echo "postgres_server=$POSTGRES_SERVER" >> "$GITHUB_OUTPUT"
          echo "openai_account=$OPENAI_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "openai_endpoint=$OPENAI_ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Enable pgvector
        shell: bash
        run: |
          set -euo pipefail

          RESOURCE_GROUP="${{ steps.resources.outputs.resource_group }}"
          POSTGRES_SERVER="${{ steps.resources.outputs.postgres_server }}"
          CURRENT_EXTENSIONS=$(az postgres flexible-server parameter show \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER" \
            --name azure.extensions \
            --query value \
            --output tsv 2>/dev/null || true)

          if ! grep -qiE '(^|,)VECTOR(,|$)' <<< "$CURRENT_EXTENSIONS"; then
            NEW_EXTENSIONS="${CURRENT_EXTENSIONS:+${CURRENT_EXTENSIONS},}VECTOR"
            az postgres flexible-server parameter set \
              --resource-group "$RESOURCE_GROUP" \
              --server-name "$POSTGRES_SERVER" \
              --name azure.extensions \
              --value "$NEW_EXTENSIONS"
          fi

          SP_APP_ID=$(az account show --query user.name --output tsv)
          SP_DISPLAY_NAME=$(az ad sp show \
            --id "$SP_APP_ID" \
            --query displayName \
            --output tsv)
          POSTGRES_TOKEN=$(az account get-access-token \
            --resource-type oss-rdbms \
            --query accessToken \
            --output tsv)

          echo "::add-mask::$POSTGRES_TOKEN"
          echo "PGHOST=${POSTGRES_SERVER}.postgres.database.azure.com" >> "$GITHUB_ENV"
          echo "PGDATABASE=adventra" >> "$GITHUB_ENV"
          echo "PGUSER=$SP_DISPLAY_NAME" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$POSTGRES_TOKEN" >> "$GITHUB_ENV"
          echo "PGSSLMODE=require" >> "$GITHUB_ENV"

      - name: Configure Azure OpenAI access
        shell: bash
        run: |
          set -euo pipefail

          OPENAI_KEY=$(az cognitiveservices account keys list \
            --resource-group "${{ steps.resources.outputs.resource_group }}" \
            --name "${{ steps.resources.outputs.openai_account }}" \
            --query key1 \
            --output tsv)
          echo "::add-mask::$OPENAI_KEY"
          echo "AZURE_OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_ENDPOINT=${{ steps.resources.outputs.openai_endpoint }}" >> "$GITHUB_ENV"
          echo "AZURE_OPENAI_EMBEDDING_DEPLOYMENT=$EMBEDDING_DEPLOYMENT" >> "$GITHUB_ENV"

      - name: Ingest books
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}" == "true" ]]; then
            EXTRA_ARGS+=(--force)
          fi

          python -m ingestion.adventra_ingest.cli \
            "$BOOK_GLOB" \
            --source-root . \
            "${EXTRA_ARGS[@]}"

      - name: Verify imported content
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "
            SELECT
              b.book_id,
              b.title,
              e.language,
              COUNT(DISTINCT c.chapter_id) AS chapters,
              COUNT(DISTINCT p.passage_id) AS passages,
              COUNT(DISTINCT r.chunk_id) AS rag_chunks
            FROM books b
            JOIN book_editions e ON e.book_id = b.book_id AND e.is_active
            JOIN chapters c ON c.book_id = b.book_id AND c.language = e.language AND c.is_active
            JOIN passages p ON p.chapter_id = c.chapter_id AND p.is_active
            JOIN rag_chunks r ON r.chapter_id = c.chapter_id
            GROUP BY b.book_id, b.title, e.language
            ORDER BY b.book_id, e.language;
          "
