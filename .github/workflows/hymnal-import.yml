name: Import approved hymnal

on:
  push:
    branches: [dev]
    paths:
      - 'ingestion/hymnal/**'
      - 'ingestion/tests/test_hymnal.py'
      - '.github/workflows/hymnal-import.yml'
  workflow_dispatch:
    inputs:
      rawDirectory:
        description: Checked-in, rights-reviewed text directory, relative to the Infra repository
        required: true
        type: string
        default: data/adventist-hymnal/hymn_text
      metadataPath:
        description: Checked-in review JSON with individual approved rights and publication approval
        required: true
        type: string
        default: data/adventist-hymnal/review-metadata.json
      expectedSha256:
        description: Expected lowercase SHA-256 of the generated backend manifest (not the review JSON)
        required: true
        type: string
      publish:
        description: Publish validated hymns to the publicly accessible DEVELOPMENT API
        required: true
        type: boolean
        default: false
      confirmation:
        description: Publication requires PUBLISH approved hymns to dev
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hymnal-dev-import
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate approved manifest in disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hymnal
          POSTGRES_PASSWORD: hymnal-test-only
          POSTGRES_DB: hymnal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hymnal -d hymnal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAW_DIRECTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.rawDirectory || 'ingestion/hymnal/examples' }}
      METADATA_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.metadataPath || 'ingestion/hymnal/examples/metadata.json' }}
      EXPECTED_SHA256: ${{ inputs.expectedSha256 }}
      PUBLISH: ${{ inputs.publish }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DATABASE_URL: postgres://hymnal:hymnal-test-only@localhost:5432/hymnal_test
    outputs:
      sha256: ${{ steps.manifest.outputs.sha256 }}
      records: ${{ steps.manifest.outputs.records }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check branch, source paths and publication confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for name in ("RAW_DIRECTORY", "METADATA_PATH"):
              relative = Path(os.environ[name])
              if relative.is_absolute() or not (root / relative).resolve().is_relative_to(root):
                  raise SystemExit(f"{name} must remain inside the checked-out Infra repository.")
          if os.environ["PUBLISH"] == "true" and os.environ["CONFIRMATION"] != "PUBLISH approved hymns to dev":
              raise SystemExit("Explicit public development publication confirmation is required.")
          PY
      - name: Test offline preparation and verification
        working-directory: ingestion
        run: python3 -m unittest discover -s tests -p 'test_hymnal.py' -v
      - name: Convert approved text and verify requested checksum
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/hymnal-package"
          python3 -m ingestion.hymnal.cli \
            --raw-dir "$RAW_DIRECTORY" \
            --metadata "$METADATA_PATH" \
            --output "$RUNNER_TEMP/hymnal-package/manifest.json" \
            > "$RUNNER_TEMP/hymnal-package/provenance.json"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "hymnal-package/manifest.json"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = os.environ["EXPECTED_SHA256"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              if not re.fullmatch("[0-9a-f]{64}", expected) or digest != expected:
                  raise SystemExit("Generated manifest does not match the requested lowercase SHA-256.")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha256={digest}\nrecords={len(manifest['hymns'])}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"Validated {len(manifest['hymns'])} records; SHA-256 `{digest}`.\n")
          PY
      - name: Checkout canonical backend importer
        uses: actions/checkout@v4
        with:
          repository: Adventra-org/AdventraBackend
          ref: dev
          path: backend
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Install backend build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-hymnal-rust-1.93.0-${{ hashFiles('backend/Cargo.lock') }}
      - name: Build and exercise exact backend importer
        env:
          EXPECTED_HASH: ${{ steps.manifest.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          cargo build --locked --release
          cp target/release/egw_rust_backend "$RUNNER_TEMP/hymnal-package/adventra"
          cp -R migrations "$RUNNER_TEMP/hymnal-package/migrations"
          git rev-parse HEAD > "$RUNNER_TEMP/hymnal-package/backend-revision.txt"
          cd "$RUNNER_TEMP/hymnal-package"
          ./adventra import-content hymnal manifest.json "$EXPECTED_HASH" > validation-report.json
          ./adventra import-content hymnal manifest.json "$EXPECTED_HASH" > idempotency-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          first = json.loads(Path("validation-report.json").read_text())
          second = json.loads(Path("idempotency-report.json").read_text())
          if first["records"] != len(manifest["hymns"]) or first["changed"] != len(manifest["hymns"]) or second["changed"] != 0:
              raise SystemExit("Disposable database import/count/idempotency validation failed.")
          PY
      - name: Retain validated publication package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: hymnal-publication
          path: ${{ runner.temp }}/hymnal-package/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish approved hymns to development
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_HASH: ${{ needs.validate.outputs.sha256 }}
      EXPECTED_RECORDS: ${{ needs.validate.outputs.records }}
      RESOURCE_GROUP: adventra-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: hymnal-publication
          path: ${{ runner.temp }}/hymnal-package
      - name: Azure login using existing deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve and validate existing development database
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_SERVER=$(az postgres flexible-server list -g "$RESOURCE_GROUP" \
            --query "[?tags.environment=='dev'].name | [0]" -o tsv)
          test -n "$POSTGRES_SERVER"
          SECRET_NAME=$(az containerapp show -g "$RESOURCE_GROUP" -n adventra-api \
            --query "properties.template.containers[0].env[?name=='DATABASE_URL'].secretRef | [0]" -o tsv)
          test -n "$SECRET_NAME"
          REF=$(az containerapp secret list -g "$RESOURCE_GROUP" -n adventra-api \
            --query "[?name=='$SECRET_NAME'].keyVaultUrl | [0]" -o tsv)
          test -n "$REF"
          DATABASE_URL=$(az keyvault secret show --id "$REF" --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export EXPECTED_HOST="$POSTGRES_SERVER.postgres.database.azure.com"
          API_HOST=$(az containerapp show -g "$RESOURCE_GROUP" -n adventra-api \
            --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$API_HOST"
          export API_HOST
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlsplit
          connection = os.environ["DATABASE_URL"]
          url = urlsplit(connection)
          if url.scheme not in ("postgres", "postgresql") or url.hostname != os.environ["EXPECTED_HOST"] or unquote(url.path) != "/adventra":
              raise SystemExit("Database URL does not match the discovered development database.")
          values = {"DATABASE_URL": connection, "HYMNAL_API_URL": "https://" + os.environ["API_HOST"]}
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit("Invalid newline in deployment configuration.")
                  output.write(f"{name}={value}\n")
          PY
      - name: Import the exact validated package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hymnal-package"
          echo "$EXPECTED_HASH  manifest.json" | sha256sum --check
          chmod +x adventra
          ./adventra import-content hymnal manifest.json "$EXPECTED_HASH" > import-report.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("import-report.json").read_text())
          if report["source_sha256"] != os.environ["EXPECTED_HASH"] or report["records"] != int(os.environ["EXPECTED_RECORDS"]):
              raise SystemExit("Backend import report does not match the validated package.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"Imported {report['records']} records; changed {report['changed']}.\n")
          PY
      - name: Verify published records through the live API
        run: >-
          python3 -m ingestion.hymnal.verify
          --manifest "$RUNNER_TEMP/hymnal-package/manifest.json"
          --api-url "$HYMNAL_API_URL"
