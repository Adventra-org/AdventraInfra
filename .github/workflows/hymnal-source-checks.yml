name: Hymnal source checks

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'ingestion/hymnal/**'
      - 'ingestion/tests/test_hymnal.py'
      - 'data/adventist-hymnal/source.json'
      - '.github/workflows/hymnal-source-checks.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'ingestion/hymnal/**'
      - 'ingestion/tests/test_hymnal.py'
      - 'data/adventist-hymnal/source.json'
      - '.github/workflows/hymnal-source-checks.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline conversion
        working-directory: ingestion
        run: python -m unittest discover -s tests -p 'test_hymnal.py' -v
      - name: Convert original synthetic example
        working-directory: ingestion
        run: |
          python -m hymnal.cli \
            --raw-dir hymnal/examples \
            --metadata hymnal/examples/metadata.json \
            --output "$RUNNER_TEMP/hymnal-example.json" \
            > "$RUNNER_TEMP/hymnal-provenance.json"
